apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: log-collector
    app.kubernetes.io/part-of: fixguard-monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/component: log-collector
        app.kubernetes.io/part-of: fixguard-monitoring
    spec:
      serviceAccountName: alloy
      # ── Tolerations ────────────────────────────────────────────────────────
      # Docker Desktop runs a single node that is both control-plane and worker.
      # Without these tolerations the DaemonSet pod would not be scheduled.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: alloy
          image: grafana/alloy:v1.8.3
          imagePullPolicy: IfNotPresent
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
          env:
            # HOSTNAME is used to identify the node this Alloy instance runs on.
            # Set to spec.nodeName so the relabel rule can filter targets to
            # only pods scheduled on this node.
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 12345
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 192Mi
          # ── Security context ────────────────────────────────────────────────
          # Kubernetes API streaming needs no host filesystem or root access.
          # This is the minimum privilege needed — no NET_ADMIN, no SYS_ADMIN.
          securityContext:
            # Docker Desktop makes /var/log/pods root-only. Alloy therefore
            # runs as UID 0, with no capabilities and no privilege escalation.
            runAsUser: 473
            runAsGroup: 473
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: alloy-config
              mountPath: /etc/alloy
              readOnly: true
            # ── Host log directories (read-only) ──────────────────────────────
            # /var/log/pods — primary log source; symlink-free real files.
            # /var/log/containers — symlinks pointing into /var/log/pods;
            # needed to resolve container-named symlinks that some tools expect.
            # ── Alloy position file store ─────────────────────────────────────
            # Ephemeral runtime state for the non-root Alloy process.
            - name: alloy-positions
              mountPath: /var/lib/alloy/data
      volumes:
        - name: alloy-config
          configMap:
            name: alloy-config
        - name: alloy-positions
          emptyDir: {}
