apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: fixguard-monitoring
data:
  # ─────────────────────────────────────────────────────────────────────────────
  # Dashboard 1 — FixGuard Cluster Overview
  # Panels: Node CPU, Node Memory, Pod readiness by namespace,
  #         Deployment replica health
  # ─────────────────────────────────────────────────────────────────────────────
  cluster-overview.json: |
    {
      "title": "FixGuard — Cluster Overview",
      "uid": "fixguard-cluster",
      "tags": ["fixguard", "cluster"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "type": "stat",
          "title": "Nodes Ready",
          "id": 1,
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] },
              "mappings": []
            }
          },
          "targets": [{ "expr": "count(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "prometheus" } }]
        },
        {
          "type": "stat",
          "title": "Pods Running (fixguard)",
          "id": 2,
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] },
              "mappings": []
            }
          },
          "targets": [{ "expr": "count(kube_pod_status_ready{namespace=\"fixguard\",condition=\"true\"})", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "prometheus" } }]
        },
        {
          "type": "stat",
          "title": "Deployments Available",
          "id": 3,
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] },
              "mappings": []
            }
          },
          "targets": [{ "expr": "count(kube_deployment_status_replicas_available{namespace=\"fixguard\"} > 0)", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "prometheus" } }]
        },
        {
          "type": "stat",
          "title": "Scrape Targets UP",
          "id": 4,
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 5 }, { "color": "green", "value": 9 }] },
              "mappings": []
            }
          },
          "targets": [{ "expr": "count(up == 1)", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "prometheus" } }]
        },
        {
          "type": "timeseries",
          "title": "Node CPU Usage %",
          "id": 5,
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0, "max": 1,
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "targets": [{
            "expr": "1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[2m])) by (instance)",
            "legendFormat": "{{ instance }}",
            "refId": "A",
            "datasource": { "type": "prometheus", "uid": "prometheus" }
          }]
        },
        {
          "type": "timeseries",
          "title": "Node Memory Usage %",
          "id": 6,
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0, "max": 1,
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "targets": [{
            "expr": "1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
            "legendFormat": "{{ instance }}",
            "refId": "A",
            "datasource": { "type": "prometheus", "uid": "prometheus" }
          }]
        },
        {
          "type": "table",
          "title": "Pod Readiness — fixguard namespace",
          "id": 7,
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "options": { "sortBy": [{ "displayName": "pod", "desc": false }] },
          "fieldConfig": {
            "defaults": { "custom": { "displayMode": "auto" } },
            "overrides": [{
              "matcher": { "id": "byName", "options": "Value" },
              "properties": [{ "id": "mappings", "value": [{ "type": "value", "options": { "1": { "text": "Ready", "color": "green" }, "0": { "text": "Not Ready", "color": "red" } } }] }]
            }]
          },
          "targets": [{
            "expr": "kube_pod_status_ready{namespace=\"fixguard\",condition=\"true\"}",
            "legendFormat": "",
            "refId": "A",
            "instant": true,
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "format": "table"
          }],
          "transformations": [
            { "id": "organize", "options": { "includeByName": { "pod": true, "namespace": true, "Value": true }, "renameByName": { "Value": "Ready" } } }
          ]
        },
        {
          "type": "table",
          "title": "Deployment Replicas — fixguard namespace",
          "id": 8,
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "custom": { "displayMode": "auto" } } },
          "targets": [
            { "expr": "kube_deployment_status_replicas_available{namespace=\"fixguard\"}", "legendFormat": "", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "prometheus" }, "format": "table" },
            { "expr": "kube_deployment_spec_replicas{namespace=\"fixguard\"}", "legendFormat": "", "refId": "B", "instant": true, "datasource": { "type": "prometheus", "uid": "prometheus" }, "format": "table" }
          ],
          "transformations": [
            { "id": "merge", "options": {} },
            { "id": "organize", "options": { "includeByName": { "deployment": true, "Value #A": true, "Value #B": true }, "renameByName": { "Value #A": "Available", "Value #B": "Desired" } } }
          ]
        }
      ]
    }
  slo-overview.json: |
    {
      "title": "FixGuard SRE / SLO Overview",
      "uid": "fixguard-slo",
      "tags": ["fixguard", "sre", "slo"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        { "type": "stat", "title": "Portfolio Availability", "id": 1, "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 }, "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 0.999 }] } } }, "targets": [{ "expr": "fixguard:sli:availability:ratio", "refId": "A", "instant": true }] },
        { "type": "stat", "title": "Availability SLO Target", "id": 2, "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 }, "fieldConfig": { "defaults": { "unit": "percentunit", "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } } }, "targets": [{ "expr": "fixguard:slo:availability:target", "refId": "A", "instant": true }] },
        { "type": "stat", "title": "Availability Budget Remaining", "id": 3, "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 }, "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 0.25 }, { "color": "green", "value": 0.5 }] } } }, "targets": [{ "expr": "fixguard:error_budget:availability:remaining_ratio", "refId": "A", "instant": true }] },
        { "type": "table", "title": "Deployment Availability", "id": 4, "gridPos": { "x": 18, "y": 0, "w": 6, "h": 8 }, "targets": [{ "expr": "kube_deployment_status_replicas_available{namespace=\"fixguard\"} / kube_deployment_spec_replicas{namespace=\"fixguard\"}", "legendFormat": "{{deployment}}", "refId": "A", "instant": true, "format": "table" }] },
        { "type": "stat", "title": "HTTP Non-5xx Success", "id": 5, "gridPos": { "x": 0, "y": 4, "w": 6, "h": 4 }, "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 0.995 }] } } }, "targets": [{ "expr": "fixguard:sli:http_success:ratio", "refId": "A", "instant": true }] },
        { "type": "stat", "title": "HTTP Success SLO Target", "id": 6, "gridPos": { "x": 6, "y": 4, "w": 6, "h": 4 }, "fieldConfig": { "defaults": { "unit": "percentunit", "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } } }, "targets": [{ "expr": "fixguard:slo:http_success:target", "refId": "A", "instant": true }] },
        { "type": "stat", "title": "HTTP Budget Remaining", "id": 7, "gridPos": { "x": 12, "y": 4, "w": 6, "h": 4 }, "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 0.25 }, { "color": "green", "value": 0.5 }] } } }, "targets": [{ "expr": "fixguard:error_budget:http_success:remaining_ratio", "refId": "A", "instant": true }] },
        { "type": "timeseries", "title": "Request and 5xx Rate", "id": 8, "gridPos": { "x": 0, "y": 8, "w": 12, "h": 7 }, "fieldConfig": { "defaults": { "unit": "reqps" } }, "targets": [{ "expr": "fixguard:sli:http_request_rate:per_second", "legendFormat": "all requests", "refId": "A" }, { "expr": "fixguard:sli:http_5xx_rate:per_second", "legendFormat": "5xx", "refId": "B" }] },
        { "type": "timeseries", "title": "API Latency Percentiles", "id": 9, "gridPos": { "x": 12, "y": 8, "w": 12, "h": 7 }, "fieldConfig": { "defaults": { "unit": "s", "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.5 }] } } }, "targets": [{ "expr": "fixguard:sli:http_latency_p50:seconds", "legendFormat": "p50", "refId": "A" }, { "expr": "fixguard:sli:http_latency_p95:seconds", "legendFormat": "p95", "refId": "B" }, { "expr": "fixguard:sli:http_latency_p99:seconds", "legendFormat": "p99", "refId": "C" }] },
        { "type": "timeseries", "title": "RabbitMQ Queue and DLQ Depth", "id": 10, "gridPos": { "x": 0, "y": 15, "w": 12, "h": 7 }, "targets": [{ "expr": "rabbitmq_queue_messages{job=\"rabbitmq-per-object\",queue!~\".*\\\\.dlq$\"}", "legendFormat": "queue {{queue}}", "refId": "A" }, { "expr": "rabbitmq_queue_messages{job=\"rabbitmq-per-object\",queue=~\".*\\\\.dlq$\"}", "legendFormat": "DLQ {{queue}}", "refId": "B" }] },
        { "type": "timeseries", "title": "RabbitMQ Consumers", "id": 11, "gridPos": { "x": 12, "y": 15, "w": 6, "h": 7 }, "targets": [{ "expr": "rabbitmq_queue_consumers{job=\"rabbitmq-per-object\"}", "legendFormat": "{{queue}}", "refId": "A" }] },
        { "type": "stat", "title": "Ready FixGuard Pods", "id": 12, "gridPos": { "x": 18, "y": 15, "w": 6, "h": 3 }, "targets": [{ "expr": "sum(kube_pod_status_ready{namespace=\"fixguard\",condition=\"true\"})", "refId": "A", "instant": true }] },
        { "type": "stat", "title": "Restarts in 1h", "id": 13, "gridPos": { "x": 18, "y": 18, "w": 6, "h": 4 }, "targets": [{ "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"fixguard\"}[1h]))", "refId": "A", "instant": true }] }
      ]
    }

  # ─────────────────────────────────────────────────────────────────────────────
  # Dashboard 2 — FixGuard Application Services
  # Panels: Per-service container CPU & memory, RabbitMQ queue depth & consumers
  # ─────────────────────────────────────────────────────────────────────────────
  application-services.json: |
    {
      "title": "FixGuard — Application Services",
      "uid": "fixguard-services",
      "tags": ["fixguard", "services", "rabbitmq"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "type": "stat",
          "title": "RabbitMQ — Total Messages",
          "id": 1,
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 100 }, { "color": "red", "value": 1000 }] }
            }
          },
          "targets": [{ "expr": "sum(rabbitmq_queue_messages)", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "prometheus" } }]
        },
        {
          "type": "stat",
          "title": "RabbitMQ — Ready Messages",
          "id": 2,
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 50 }, { "color": "red", "value": 500 }] }
            }
          },
          "targets": [{ "expr": "sum(rabbitmq_queue_messages_ready)", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "prometheus" } }]
        },
        {
          "type": "stat",
          "title": "RabbitMQ — Consumers",
          "id": 3,
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "targets": [{ "expr": "sum(rabbitmq_queue_consumers)", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "prometheus" } }]
        },
        {
          "type": "stat",
          "title": "RabbitMQ — Unacked Messages",
          "id": 4,
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 10 }, { "color": "red", "value": 100 }] }
            }
          },
          "targets": [{ "expr": "sum(rabbitmq_queue_messages_unacked)", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "prometheus" } }]
        },
        {
          "type": "timeseries",
          "title": "RabbitMQ — Queue Depth per Queue",
          "id": 5,
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "targets": [{
            "expr": "rabbitmq_queue_messages",
            "legendFormat": "{{ queue }}",
            "refId": "A",
            "datasource": { "type": "prometheus", "uid": "prometheus" }
          }]
        },
        {
          "type": "timeseries",
          "title": "Container CPU Usage — fixguard services (mCores)",
          "id": 6,
          "gridPos": { "x": 0, "y": 11, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 8 }
            }
          },
          "targets": [{
            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"fixguard\", container!=\"\", container!=\"POD\"}[2m])) by (container) * 1000",
            "legendFormat": "{{ container }}",
            "refId": "A",
            "datasource": { "type": "prometheus", "uid": "prometheus" }
          }]
        },
        {
          "type": "timeseries",
          "title": "Container Memory Usage — fixguard services",
          "id": 7,
          "gridPos": { "x": 12, "y": 11, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 8 }
            }
          },
          "targets": [{
            "expr": "sum(container_memory_working_set_bytes{namespace=\"fixguard\", container!=\"\", container!=\"POD\"}) by (container)",
            "legendFormat": "{{ container }}",
            "refId": "A",
            "datasource": { "type": "prometheus", "uid": "prometheus" }
          }]
        },
        {
          "type": "timeseries",
          "title": "RabbitMQ — Message Publish Rate",
          "id": 8,
          "gridPos": { "x": 0, "y": 19, "w": 12, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 8 }
            }
          },
          "targets": [{
            "expr": "rate(rabbitmq_queue_messages_published_total[2m])",
            "legendFormat": "{{ queue }}",
            "refId": "A",
            "datasource": { "type": "prometheus", "uid": "prometheus" }
          }]
        },
        {
          "type": "timeseries",
          "title": "RabbitMQ — Message Deliver Rate",
          "id": 9,
          "gridPos": { "x": 12, "y": 19, "w": 12, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 8 }
            }
          },
          "targets": [{
            "expr": "rate(rabbitmq_queue_messages_delivered_total[2m])",
            "legendFormat": "{{ queue }}",
            "refId": "A",
            "datasource": { "type": "prometheus", "uid": "prometheus" }
          }]
        }
      ]
    }

  # ─────────────────────────────────────────────────────────────────────────────
  # Dashboard 3 — FixGuard PostgreSQL
  # Panels: pg_up, connections, transactions/sec, rows fetched/inserted
  # ─────────────────────────────────────────────────────────────────────────────
  postgresql.json: |
    {
      "title": "FixGuard — PostgreSQL",
      "uid": "fixguard-postgres",
      "tags": ["fixguard", "postgresql", "database"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "type": "stat",
          "title": "PostgreSQL Exporter Up",
          "id": 1,
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "mappings": [{ "type": "value", "options": { "1": { "text": "UP", "color": "green" }, "0": { "text": "DOWN", "color": "red" } } }],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "targets": [{ "expr": "pg_up", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "prometheus" } }]
        },
        {
          "type": "stat",
          "title": "Active Connections",
          "id": 2,
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 50 }, { "color": "red", "value": 90 }] }
            }
          },
          "targets": [{ "expr": "sum(pg_stat_activity_count{state=\"active\"})", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "prometheus" } }]
        },
        {
          "type": "stat",
          "title": "Total Connections",
          "id": 3,
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 80 }, { "color": "red", "value": 100 }] }
            }
          },
          "targets": [{ "expr": "sum(pg_stat_activity_count)", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "prometheus" } }]
        },
        {
          "type": "stat",
          "title": "PostgreSQL Version",
          "id": 4,
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "none", "graphMode": "none", "textMode": "value" },
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] } } },
          "targets": [{ "expr": "pg_version_num / 10000", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "prometheus" } }]
        },
        {
          "type": "timeseries",
          "title": "Transactions per Second (commit / rollback)",
          "id": 5,
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 8 }
            }
          },
          "targets": [
            { "expr": "sum(rate(pg_stat_database_xact_commit[2m]))", "legendFormat": "commit/s", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "sum(rate(pg_stat_database_xact_rollback[2m]))", "legendFormat": "rollback/s", "refId": "B", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ]
        },
        {
          "type": "timeseries",
          "title": "Rows Fetched vs Inserted",
          "id": 6,
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 8 }
            }
          },
          "targets": [
            { "expr": "sum(rate(pg_stat_database_tup_fetched[2m]))", "legendFormat": "rows fetched/s", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "sum(rate(pg_stat_database_tup_inserted[2m]))", "legendFormat": "rows inserted/s", "refId": "B", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "sum(rate(pg_stat_database_tup_updated[2m]))", "legendFormat": "rows updated/s", "refId": "C", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "sum(rate(pg_stat_database_tup_deleted[2m]))", "legendFormat": "rows deleted/s", "refId": "D", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ]
        },
        {
          "type": "timeseries",
          "title": "Active Connections Over Time",
          "id": 7,
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 8 }
            }
          },
          "targets": [
            { "expr": "pg_stat_activity_count{state=\"active\"}", "legendFormat": "active — {{ datname }}", "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" } },
            { "expr": "pg_stat_activity_count{state=\"idle\"}", "legendFormat": "idle — {{ datname }}", "refId": "B", "datasource": { "type": "prometheus", "uid": "prometheus" } }
          ]
        },
        {
          "type": "timeseries",
          "title": "Cache Hit Ratio",
          "id": 8,
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0, "max": 1,
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 8 },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 0.8 }, { "color": "green", "value": 0.95 }] }
            }
          },
          "targets": [{
            "expr": "sum(pg_stat_database_blks_hit) / (sum(pg_stat_database_blks_hit) + sum(pg_stat_database_blks_read))",
            "legendFormat": "cache hit ratio",
            "refId": "A",
            "datasource": { "type": "prometheus", "uid": "prometheus" }
          }]
        },
        {
          "type": "table",
          "title": "Database Stats Summary",
          "id": 9,
          "gridPos": { "x": 0, "y": 19, "w": 24, "h": 7 },
          "fieldConfig": { "defaults": { "custom": { "displayMode": "auto" } } },
          "targets": [
            { "expr": "pg_stat_database_numbackends", "legendFormat": "", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "prometheus" }, "format": "table" },
            { "expr": "rate(pg_stat_database_xact_commit[5m])", "legendFormat": "", "refId": "B", "instant": true, "datasource": { "type": "prometheus", "uid": "prometheus" }, "format": "table" }
          ],
          "transformations": [
            { "id": "merge", "options": {} },
            { "id": "organize", "options": {
              "includeByName": { "datname": true, "Value #A": true, "Value #B": true },
              "renameByName": { "Value #A": "Backends", "Value #B": "Commits/s" }
            }}
          ]
        }
      ]
    }

  # ─────────────────────────────────────────────────────────────────────────────
  # Dashboard 4 — FixGuard Logs (Loki)
  # Panels: log volume over time, recent logs with service filter, error logs
  # ─────────────────────────────────────────────────────────────────────────────
  fixguard-logs.json: |
    {
      "title": "FixGuard — Logs",
      "uid": "fixguard-logs",
      "tags": ["fixguard", "logs", "loki"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "label": "Service",
            "datasource": { "type": "loki", "uid": "loki" },
            "query": "label_values({namespace=\"fixguard\"}, app)",
            "hide": 0,
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Log Volume — lines per minute by service",
          "id": 1,
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 20,
                "drawStyle": "bars",
                "barAlignment": 0
              }
            }
          },
          "targets": [{
            "datasource": { "type": "loki", "uid": "loki" },
            "expr": "sum(count_over_time({namespace=\"fixguard\", app=~\"$service\"}[1m])) by (app)",
            "legendFormat": "{{ app }}",
            "refId": "A"
          }]
        },
        {
          "type": "logs",
          "title": "Recent Logs — $service",
          "id": 2,
          "gridPos": { "x": 0, "y": 7, "w": 24, "h": 12 },
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          },
          "targets": [{
            "datasource": { "type": "loki", "uid": "loki" },
            "expr": "{namespace=\"fixguard\", app=~\"$service\"}",
            "maxLines": 500,
            "refId": "A"
          }]
        },
        {
          "type": "logs",
          "title": "Error Logs",
          "id": 3,
          "gridPos": { "x": 0, "y": 19, "w": 24, "h": 10 },
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          },
          "targets": [{
            "datasource": { "type": "loki", "uid": "loki" },
            "expr": "{namespace=\"fixguard\", app=~\"$service\"} |~ \"(?i)error\"",
            "maxLines": 200,
            "refId": "A"
          }]
        },
        {
          "type": "stat",
          "title": "Total Log Lines (last 1h)",
          "id": 4,
          "gridPos": { "x": 0, "y": 29, "w": 6, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["sum"] }, "colorMode": "background", "graphMode": "area", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] } } },
          "targets": [{ "datasource": { "type": "loki", "uid": "loki" }, "expr": "sum(count_over_time({namespace=\"fixguard\"}[1h]))", "refId": "A", "instant": true }]
        },
        {
          "type": "stat",
          "title": "Error Lines (last 1h)",
          "id": 5,
          "gridPos": { "x": 6, "y": 29, "w": 6, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["sum"] }, "colorMode": "background", "graphMode": "area", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 10 }] } } },
          "targets": [{ "datasource": { "type": "loki", "uid": "loki" }, "expr": "sum(count_over_time({namespace=\"fixguard\"} |~ \"(?i)error\" [1h]))", "refId": "A", "instant": true }]
        },
        {
          "type": "stat",
          "title": "RabbitMQ-related Lines (last 1h)",
          "id": 6,
          "gridPos": { "x": 12, "y": 29, "w": 6, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["sum"] }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] } } },
          "targets": [{ "datasource": { "type": "loki", "uid": "loki" }, "expr": "sum(count_over_time({namespace=\"fixguard\"} |= \"RabbitMQ\" [1h]))", "refId": "A", "instant": true }]
        },
        {
          "type": "stat",
          "title": "Active Services (last 5m)",
          "id": 7,
          "gridPos": { "x": 18, "y": 29, "w": 6, "h": 4 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] } } },
          "targets": [{ "datasource": { "type": "loki", "uid": "loki" }, "expr": "count(count by (app)(count_over_time({namespace=\"fixguard\"}[5m])))", "refId": "A", "instant": true }]
        }
      ]
    }
