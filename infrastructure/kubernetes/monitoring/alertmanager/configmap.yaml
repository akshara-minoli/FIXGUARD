apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: local-ui
      group_by: [alertname, namespace, service]
      group_wait: 15s
      group_interval: 2m
      repeat_interval: 4h

    receivers:
      # Intentionally has no external integration. Alerts remain observable in
      # the Alertmanager UI without credentials or outbound notifications.
      - name: local-ui
