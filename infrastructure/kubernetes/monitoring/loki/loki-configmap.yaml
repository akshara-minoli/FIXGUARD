apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: log-aggregation
    app.kubernetes.io/part-of: fixguard-monitoring
data:
  loki.yaml: |
    # Loki 3.4.3 — single-binary monolithic mode
    # Suitable for local Docker Desktop development (single node).
    # For production, migrate to scalable/microservices mode with object storage.

    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn

    # common block configures shared settings for all components
    # running inside a single binary.
    common:
      instance_addr: 127.0.0.1
      path_prefix: /var/loki
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          # inmemory is correct for a single-instance deployment.
          # Do not use this for multi-replica deployments.
          store: inmemory

    # Schema using TSDB (recommended for Loki 3.x).
    # from date must be in the past.
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    # Storage paths for tsdb shipper and chunks.
    storage_config:
      tsdb_shipper:
        active_index_directory: /var/loki/tsdb-index
        cache_location: /var/loki/tsdb-cache
      filesystem:
        directory: /var/loki/chunks

    # Limits appropriate for a local development environment.
    limits_config:
      # Reject logs older than 7 days (matches retention).
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      # Enforce 7-day retention via compactor.
      retention_period: 168h
      # Allow Alloy structured metadata (Alloy 1.x may send it).
      allow_structured_metadata: true
      # Enable log volume queries (needed for log volume dashboard panels).
      volume_enabled: true

    # Compactor handles index compaction and enforces log retention.
    # Must run as part of the monolith; working_directory must be on persistent storage.
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
      retention_delete_delay: 2h
      retention_delete_worker_count: 10

    # Query performance: small in-memory results cache suitable for local dev.
    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 50

    # Disable usage telemetry / call-home analytics.
    analytics:
      reporting_enabled: false
