apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: fixguard
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/part-of: fixguard
data:
  rabbitmq.conf: |
    # Use an absolute threshold in Kubernetes because host-memory detection can
    # exceed the container cgroup limit. This leaves 256 Mi of limit headroom.
    vm_memory_high_watermark.absolute = 512Mi
