apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-database-init
  namespace: fixguard
  labels:
    app.kubernetes.io/name: postgres-database-init
    app.kubernetes.io/component: database-initialization
    app.kubernetes.io/part-of: fixguard
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-database-init
        app.kubernetes.io/component: database-initialization
        app.kubernetes.io/part-of: fixguard
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: fixguard-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixguard-secrets
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -ec
            - |
              until pg_isready -h postgres -p 5432 -U "$PGUSER" -d postgres; do
                sleep 2
              done
      containers:
        - name: initialize-databases
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: fixguard-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixguard-secrets
                  key: POSTGRES_PASSWORD
            - name: AUTH_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixguard-secrets
                  key: AUTH_DATABASE_PASSWORD
            - name: REPORT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixguard-secrets
                  key: REPORT_DATABASE_PASSWORD
            - name: LOCATION_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixguard-secrets
                  key: LOCATION_DATABASE_PASSWORD
            - name: ASSIGNMENT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixguard-secrets
                  key: ASSIGNMENT_DATABASE_PASSWORD
            - name: NOTIFICATION_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixguard-secrets
                  key: NOTIFICATION_DATABASE_PASSWORD
            - name: ANALYTICS_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixguard-secrets
                  key: ANALYTICS_DATABASE_PASSWORD
          command:
            - sh
            - -ec
            - |
              ensure_database() {
                role_name="$1"
                role_password="$2"
                database_name="$3"

                psql -h postgres -p 5432 -d postgres -v ON_ERROR_STOP=1 \
                  --set=role_name="$role_name" \
                  --set=role_password="$role_password" \
                  --set=database_name="$database_name" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN', :'role_name')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role_name') \gexec
              SELECT format(
                'ALTER ROLE %I WITH LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS',
                :'role_name',
                :'role_password'
              ) \gexec
              SELECT format('CREATE DATABASE %I OWNER %I', :'database_name', :'role_name')
              WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'database_name') \gexec
              SELECT format('ALTER DATABASE %I OWNER TO %I', :'database_name', :'role_name') \gexec
              SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'database_name') \gexec
              SELECT format('GRANT CONNECT, TEMPORARY ON DATABASE %I TO %I', :'database_name', :'role_name') \gexec
              SQL

                psql -h postgres -p 5432 -d "$database_name" -v ON_ERROR_STOP=1 \
                  --set=role_name="$role_name" <<'SQL'
              REVOKE CREATE ON SCHEMA public FROM PUBLIC;
              SELECT format('GRANT ALL ON SCHEMA public TO %I', :'role_name') \gexec
              SQL
              }

              ensure_database fixguard_auth_user "$AUTH_DATABASE_PASSWORD" fixguard_auth
              ensure_database fixguard_report_user "$REPORT_DATABASE_PASSWORD" fixguard_report
              ensure_database fixguard_location_user "$LOCATION_DATABASE_PASSWORD" fixguard_location
              ensure_database fixguard_assignment_user "$ASSIGNMENT_DATABASE_PASSWORD" fixguard_assignment
              ensure_database fixguard_notification_user "$NOTIFICATION_DATABASE_PASSWORD" fixguard_notification
              ensure_database fixguard_analytics_user "$ANALYTICS_DATABASE_PASSWORD" fixguard_analytics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
