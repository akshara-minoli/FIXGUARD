apiVersion: v1
kind: Secret
metadata:
  name: fixguard-secrets-example
  namespace: fixguard
  labels:
    app.kubernetes.io/part-of: fixguard
type: Opaque
stringData:
  JWT_SECRET: replace_with_secure_jwt_secret
  INTERNAL_SERVICE_KEY: replace_with_long_random_internal_service_key

  POSTGRES_USER: replace_with_postgres_administrator_username
  POSTGRES_PASSWORD: replace_with_secure_postgres_administrator_password

  AUTH_DATABASE_PASSWORD: replace_with_secure_auth_database_password
  REPORT_DATABASE_PASSWORD: replace_with_secure_report_database_password
  LOCATION_DATABASE_PASSWORD: replace_with_secure_location_database_password
  ASSIGNMENT_DATABASE_PASSWORD: replace_with_secure_assignment_database_password
  NOTIFICATION_DATABASE_PASSWORD: replace_with_secure_notification_database_password
  ANALYTICS_DATABASE_PASSWORD: replace_with_secure_analytics_database_password

  AUTH_DATABASE_URL: postgresql://fixguard_auth_user:AUTH_PASSWORD_URL_ENCODED@postgres:5432/fixguard_auth?schema=public
  REPORT_DATABASE_URL: postgresql://fixguard_report_user:REPORT_PASSWORD_URL_ENCODED@postgres:5432/fixguard_report?schema=public
  LOCATION_DATABASE_URL: postgresql://fixguard_location_user:LOCATION_PASSWORD_URL_ENCODED@postgres:5432/fixguard_location?schema=public
  ASSIGNMENT_DATABASE_URL: postgresql://fixguard_assignment_user:ASSIGNMENT_PASSWORD_URL_ENCODED@postgres:5432/fixguard_assignment?schema=public
  NOTIFICATION_DATABASE_URL: postgresql://fixguard_notification_user:NOTIFICATION_PASSWORD_URL_ENCODED@postgres:5432/fixguard_notification?schema=public
  ANALYTICS_DATABASE_URL: postgresql://fixguard_analytics_user:ANALYTICS_PASSWORD_URL_ENCODED@postgres:5432/fixguard_analytics?schema=public

  RABBITMQ_USER: replace_with_rabbitmq_username
  RABBITMQ_PASSWORD: replace_with_secure_rabbitmq_password
  RABBITMQ_URL: amqp://RABBITMQ_USER:RABBITMQ_PASSWORD@rabbitmq:5672

  ADMIN_PASSWORD: replace_with_secure_admin_password
