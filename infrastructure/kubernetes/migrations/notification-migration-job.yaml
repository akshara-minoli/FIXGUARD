apiVersion: batch/v1
kind: Job
metadata:
  name: notification-migration
  namespace: fixguard
  labels:
    app.kubernetes.io/name: notification-migration
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: fixguard
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-migration
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/part-of: fixguard
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/akshara-minoli/fixguard-notification:8610ef5fc898
          imagePullPolicy: IfNotPresent
          command:
            - npm
            - run
            - prisma:migrate:deploy
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fixguard-secrets
                  key: NOTIFICATION_DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
