apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: fixguard
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: fixguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: fixguard
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-service
          image: ghcr.io/akshara-minoli/fixguard-auth:phase10.5-local
          imagePullPolicy: IfNotPresent
          command:
            - npm
            - start
          ports:
            - name: http
              containerPort: 4001
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: fixguard-app-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: fixguard-app-config
                  key: AUTH_PORT
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: fixguard-app-config
                  key: FRONTEND_URL
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: fixguard-app-config
                  key: JWT_EXPIRES_IN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fixguard-secrets
                  key: AUTH_DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fixguard-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
