apiVersion: batch/v1
kind: Job
metadata:
  name: auth-admin-seed
  namespace: fixguard
  labels:
    app.kubernetes.io/name: auth-admin-seed
    app.kubernetes.io/component: database-seed
    app.kubernetes.io/part-of: fixguard
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-admin-seed
        app.kubernetes.io/component: database-seed
        app.kubernetes.io/part-of: fixguard
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: ghcr.io/akshara-minoli/fixguard-auth:08ed08f3f4b4
          imagePullPolicy: IfNotPresent
          command:
            - npm
            - run
            - seed:admin
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fixguard-secrets
                  key: AUTH_DATABASE_URL
            - name: ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: fixguard-app-config
                  key: ADMIN_USERNAME
            - name: ADMIN_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: fixguard-app-config
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixguard-secrets
                  key: ADMIN_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
