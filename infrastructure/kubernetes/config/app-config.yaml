apiVersion: v1
kind: ConfigMap
metadata:
  name: fixguard-app-config
  namespace: fixguard
  labels:
    app.kubernetes.io/part-of: fixguard
data:
  NODE_ENV: production
  FRONTEND_URL: http://fixguard.local
  JWT_EXPIRES_IN: 1h

  AUTH_PORT: "4001"
  REPORT_PORT: "4002"
  LOCATION_PORT: "4003"
  ASSIGNMENT_PORT: "4004"
  NOTIFICATION_PORT: "4005"
  ANALYTICS_PORT: "4006"

  AUTH_DATABASE_NAME: fixguard_auth
  REPORT_DATABASE_NAME: fixguard_report
  LOCATION_DATABASE_NAME: fixguard_location
  ASSIGNMENT_DATABASE_NAME: fixguard_assignment
  NOTIFICATION_DATABASE_NAME: fixguard_notification
  ANALYTICS_DATABASE_NAME: fixguard_analytics

  LOCATION_SERVICE_URL: http://location-service:4003
  REPORT_SERVICE_URL: http://report-service:4002
  ASSIGNMENT_SERVICE_URL: http://assignment-service:4004

  RABBITMQ_EXCHANGE: fixguard.events
  NOTIFICATION_QUEUE: notification-service.events
  NOTIFICATION_DLQ: notification-service.dlq
  ANALYTICS_QUEUE: analytics-service.events
  ANALYTICS_DLQ: analytics-service.dlq

  ADMIN_USERNAME: admin123
  ADMIN_EMAIL: admin123@fixguard.com
