services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - fixguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${AUTH_PORT:-4001}:4001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  report-db-init:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      REPORT_DB: ${REPORT_DB:-fixguard_report}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        if psql -h postgres -U "$$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$REPORT_DB'" | grep -q 1; then
          echo "Report database already exists"
        else
          createdb -h postgres -U "$$POSTGRES_USER" -O "$$POSTGRES_USER" "$$REPORT_DB"
          echo "Report database created"
        fi
    restart: "no"

  report-service:
    build:
      context: ./services/report-service
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${REPORT_DB:-fixguard_report}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      LOCATION_SERVICE_URL: http://location-service:4003
    ports:
      - "127.0.0.1:${REPORT_PORT:-4002}:4002"
    depends_on:
      report-db-init:
        condition: service_completed_successfully
      location-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  location-db-init:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      LOCATION_DB: ${LOCATION_DB:-fixguard_location}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        if psql -h postgres -U "$$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$LOCATION_DB'" | grep -q 1; then
          echo "Location database already exists"
        else
          createdb -h postgres -U "$$POSTGRES_USER" -O "$$POSTGRES_USER" "$$LOCATION_DB"
          echo "Location database created"
        fi
    restart: "no"

  location-service:
    build:
      context: ./services/location-service
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4003
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${LOCATION_DB:-fixguard_location}?schema=public
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:${LOCATION_PORT:-4003}:4003"
    depends_on:
      location-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  assignment-db-init:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      ASSIGNMENT_DB: ${ASSIGNMENT_DB:-fixguard_assignment}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        if psql -h postgres -U "$$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$ASSIGNMENT_DB'" | grep -q 1; then
          echo "Assignment database already exists"
        else
          createdb -h postgres -U "$$POSTGRES_USER" -O "$$POSTGRES_USER" "$$ASSIGNMENT_DB"
          echo "Assignment database created"
        fi
    restart: "no"

  assignment-service:
    build:
      context: ./services/assignment-service
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4004
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${ASSIGNMENT_DB:-fixguard_assignment}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      REPORT_SERVICE_URL: http://report-service:4002
      LOCATION_SERVICE_URL: http://location-service:4003
    ports:
      - "127.0.0.1:${ASSIGNMENT_PORT:-4004}:4004"
    depends_on:
      assignment-db-init:
        condition: service_completed_successfully
      report-service:
        condition: service_healthy
      location-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  fixguard_postgres_data:
    name: fixguard_postgres_data
